name: Build macOS ARM64 test artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-macos-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-macos-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --basetemp "$RUNNER_TEMP/oxford-to-notion-tests"

      - name: Build application
        run: bash scripts/build_macos_app.sh

      - name: Verify ARM64 executable
        run: |
          lipo -info "dist/Oxford to Notion.app/Contents/MacOS/Oxford to Notion"
          lipo -info "dist/Oxford to Notion.app/Contents/MacOS/Oxford to Notion" | grep -q "arm64"

      - name: Build DMG
        run: bash scripts/package_macos_dmg.sh

      - name: Mount and smoke-test DMG
        run: |
          mkdir -p "work/macos/mounted"
          hdiutil attach "release/Oxford-to-Notion-macOS-arm64.dmg" -mountpoint "$PWD/work/macos/mounted" -nobrowse -readonly
          "work/macos/mounted/Oxford to Notion.app/Contents/MacOS/Oxford to Notion" --smoke-test

      - name: Detach DMG
        if: always()
        run: hdiutil detach "$PWD/work/macos/mounted" || true

      - name: Upload private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oxford-to-Notion-macOS-arm64
          path: |
            release/Oxford-to-Notion-macOS-arm64.dmg
            release/Oxford-to-Notion-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
